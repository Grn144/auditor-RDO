<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auditor RDO — Diário de Obra</title>
<style>
:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#eef2f7; --border:#dce3ec;
  --text:#1a2230; --muted:#63708a; --brand:#1f6feb; --brand-ink:#0b57d0;
  --accent:#f59e0b; --ok:#15803d; --ok-bg:#dcfce7; --bad:#b91c1c; --bad-bg:#fee2e2;
  --warn:#92600a; --warn-bg:#fef3c7; --shadow:0 1px 3px rgba(16,24,40,.08),0 8px 24px rgba(16,24,40,.06);
  --radius:14px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d1117; --surface:#161b22; --surface-2:#1c232d; --border:#2a323d;
  --text:#e6edf3; --muted:#9aa7b8; --brand:#4d9fff; --brand-ink:#79b6ff;
  --ok:#4ade80; --ok-bg:#0f2f1c; --bad:#f87171; --bad-bg:#3a1414;
  --warn:#fbbf24; --warn-bg:#3a2c08;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5}
a{color:var(--brand-ink)}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px 60px}

header.top{background:linear-gradient(135deg,var(--brand-ink),var(--brand));color:#fff;
  padding:22px 0;box-shadow:var(--shadow);margin-bottom:26px}
header.top .wrap{padding-bottom:0}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:44px;height:44px;border-radius:11px;background:rgba(255,255,255,.16);
  display:grid;place-items:center;font-size:24px;flex:none}
.brand h1{font-size:20px;margin:0;font-weight:650;letter-spacing:.2px}
.brand p{margin:2px 0 0;font-size:13px;opacity:.85}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:22px;margin-bottom:22px}
.card h2{font-size:15px;margin:0 0 16px;font-weight:650;display:flex;align-items:center;gap:9px}
.card h2 .num{width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;
  font-size:13px;display:grid;place-items:center;flex:none}

label.field{display:block;margin-bottom:14px}
label.field .lab{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--muted)}
input[type=text],input[type=password],select{width:100%;padding:11px 13px;font-size:14px;
  background:var(--surface-2);border:1px solid var(--border);border-radius:10px;color:var(--text);
  outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(31,111,235,.18)}
.pwrow{position:relative}
.pwrow button.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;font-size:15px;color:var(--muted);padding:6px}
.hint{font-size:12px;color:var(--muted);margin-top:5px}

.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.checkline{display:flex;align-items:center;gap:9px;font-size:14px;cursor:pointer;user-select:none}
.checkline input{width:17px;height:17px;accent-color:var(--brand);cursor:pointer}

.btn{appearance:none;border:none;border-radius:10px;padding:12px 20px;font-size:14px;
  font-weight:650;cursor:pointer;display:inline-flex;align-items:center;gap:9px;
  transition:transform .05s,filter .15s,background .15s}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover:not(:disabled){filter:brightness(1.07)}
.btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover:not(:disabled){border-color:var(--brand)}

.spinner{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;
  border-radius:50%;animation:spin .7s linear infinite;display:none}
.btn.loading .spinner{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

.hidden{display:none!important}

/* report summary */
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.chip{background:var(--surface-2);border:1px solid var(--border);border-radius:999px;
  padding:7px 14px;font-size:13px;display:flex;align-items:center;gap:7px}
.chip b{font-weight:700}
.chip .k{color:var(--muted)}
.destino{font-size:12.5px;color:var(--muted);margin-top:8px;word-break:break-all}
.destino code{background:var(--surface-2);padding:2px 7px;border-radius:6px;border:1px solid var(--border)}

.ia-panel{background:var(--surface-2);border:1px dashed var(--border);border-radius:10px;
  padding:14px;margin-top:12px}

/* gallery */
.grupo-sec{margin-top:26px}
.grupo-head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;
  background:linear-gradient(135deg,var(--brand-ink),var(--brand));color:#fff;box-shadow:var(--shadow)}
.grupo-letra{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.2);
  display:grid;place-items:center;font-weight:800;font-size:17px;text-transform:uppercase;flex:none}
.grupo-nome{font-weight:700;font-size:15px}
.grupo-pasta{margin-left:auto;font-size:12.5px;opacity:.9;font-family:ui-monospace,Consolas,monospace}
.group-title{font-size:14px;font-weight:700;margin:18px 0 12px;display:flex;align-items:center;gap:10px}
.group-title .code{background:var(--brand);color:#fff;border-radius:7px;padding:3px 10px;font-size:13px}
.group-title .desc{color:var(--muted);font-weight:500;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.ph{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;
  box-shadow:var(--shadow);display:flex;flex-direction:column}
.ph .thumb{aspect-ratio:3/4;background:var(--surface-2);position:relative;overflow:hidden}
.ph .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ph .fname{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.68);color:#fff;
  font-size:12px;font-weight:600;padding:3px 9px;border-radius:7px}
.ph .body{padding:10px 12px;font-size:12.5px}
.ph .verd{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12px;
  padding:4px 9px;border-radius:7px;margin-bottom:6px}
.v-COMPATIVEL{background:var(--ok-bg);color:var(--ok)}
.v-DIVERGENTE{background:var(--bad-bg);color:var(--bad)}
.v-INCONCLUSIVO{background:var(--warn-bg);color:var(--warn)}
.ph .motivo{color:var(--muted);font-size:12px}
.ph .pend{font-size:11px;color:var(--muted);padding:0 12px 10px}
.badge-dl{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--surface-2);
  border:1px solid var(--border);color:var(--muted)}

/* progress */
.pbar{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin:6px 0 12px}
.pbar > i{display:block;height:100%;width:0;background:var(--brand);transition:width .25s}
.log{background:#0b0f14;color:#c9d4e3;font:12px/1.6 ui-monospace,Consolas,monospace;
  border-radius:10px;padding:12px 14px;max-height:190px;overflow:auto;white-space:pre-wrap}
@media (prefers-color-scheme:light){.log{background:#0f172a}}

.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:14px;text-align:center}
.stat .n{font-size:26px;font-weight:750}
.stat .l{font-size:12px;color:var(--muted);margin-top:2px}
.stat.ok .n{color:var(--ok)} .stat.bad .n{color:var(--bad)} .stat.warn .n{color:var(--warn)}

/* toast */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(120%);
  background:var(--bad);color:#fff;padding:13px 20px;border-radius:11px;box-shadow:var(--shadow);
  font-size:14px;max-width:90%;transition:transform .3s;z-index:50}
#toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <div class="logo">🏗️</div>
      <div>
        <h1>Auditor de RDO</h1>
        <p>Baixa, nomeia por código e (opcional) audita as fotos do Diário de Obra</p>
      </div>
    </div>
  </div>
</header>

<div class="wrap">

  <!-- Passo 1: conexão -->
  <div class="card" id="cardConfig">
    <h2><span class="num">1</span> Conectar ao relatório</h2>
    <label class="field">
      <span class="lab">Token da empresa (Diário de Obra)</span>
      <div class="pwrow">
        <input type="password" id="token" placeholder="Cole aqui o token de Cadastros &gt; Empresa &gt; Gerar token" autocomplete="off">
        <button class="eye" id="eyeToken" title="Mostrar/ocultar">👁</button>
      </div>
      <div class="hint">🔒 O token é salvo neste navegador e preenchido automaticamente. <a href="https://web.diariodeobra.app" target="_blank" rel="noopener">Abrir o sistema</a> · <a href="#" id="esquecer">esquecer token salvo</a></div>
    </label>
    <label class="field">
      <span class="lab">URL da obra ou do relatório</span>
      <input type="text" id="alvo" placeholder="https://web.diariodeobra.app/#/app/obras/.../lista-de-tarefas">
      <div class="hint">Cole a URL da <b>lista de tarefas da obra</b> (baixa tudo) ou de um <b>relatório</b> específico.</div>
    </label>
    <div class="row" style="justify-content:flex-end">
      <button class="btn btn-primary" id="btnCarregar">
        <span class="spinner"></span> Carregar relatório
      </button>
    </div>
  </div>

  <!-- Passo 2: relatório + opções -->
  <div class="card hidden" id="cardReport">
    <h2><span class="num">2</span> Relatório carregado</h2>
    <div class="chips" id="chips"></div>
    <div class="destino" id="destino"></div>

    <div class="ia-panel">
      <div class="row" style="justify-content:space-between">
        <label class="checkline"><input type="checkbox" id="forcar"> Rebaixar mesmo se já existir</label>
        <label class="checkline"><input type="checkbox" id="usarIA"> Auditar fotos com IA</label>
      </div>
      <div id="iaOpts" class="hidden" style="margin-top:12px">
        <div class="row">
          <label class="field" style="flex:1;min-width:180px;margin:0">
            <span class="lab">Provedor de IA</span>
            <select id="provedor">
              <option value="groq">Groq (gratuito)</option>
              <option value="anthropic">Anthropic / Claude (pago)</option>
            </select>
          </label>
          <label class="field" style="flex:2;min-width:220px;margin:0">
            <span class="lab">Chave da IA</span>
            <div class="pwrow">
              <input type="password" id="chaveIA" placeholder="Chave do provedor selecionado" autocomplete="off">
              <button class="eye" id="eyeIA" title="Mostrar/ocultar">👁</button>
            </div>
            <div class="hint" id="iaHint">Gere grátis em <a href="https://console.groq.com/keys" target="_blank" rel="noopener">console.groq.com/keys</a>.</div>
          </label>
        </div>
      </div>
    </div>

    <div class="row" style="margin-top:16px">
      <button class="btn btn-primary" id="btnProcessar">
        <span class="spinner"></span> Baixar fotos
      </button>
      <button class="btn btn-ghost" id="btnTrocar">Trocar relatório</button>
    </div>
  </div>

  <!-- Progresso -->
  <div class="card hidden" id="cardProgress">
    <h2><span class="num">3</span> Progresso</h2>
    <div class="pbar"><i id="pbarFill"></i></div>
    <div id="progTxt" class="hint" style="margin-bottom:10px"></div>
    <div class="log" id="log"></div>
  </div>

  <!-- Resultado -->
  <div class="card hidden" id="cardResult">
    <h2><span class="num">✓</span> Concluído</h2>
    <div class="summary-grid" id="summary"></div>
    <div class="row">
      <button class="btn btn-primary" id="btnPasta">📂 Abrir pasta</button>
      <button class="btn btn-ghost" id="btnCsv">⬇ Baixar CSV</button>
    </div>
  </div>

  <!-- Galeria -->
  <div id="galeria"></div>

</div>

<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let ESTADO = { fotos:[], destino:"", csv:"", numero:null };

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),5000); }
function loading(btn,on){ btn.classList.toggle("loading",on); btn.disabled=on; }
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function img(u){ return "/api/img?u="+encodeURIComponent(u); }

// eye toggles
function eye(btnId,inpId){ $(btnId).onclick=()=>{ const i=$(inpId);
  i.type = i.type==="password"?"text":"password"; }; }
eye("#eyeToken","#token"); eye("#eyeIA","#chaveIA");

// IA toggle
$("#usarIA").onchange = e => $("#iaOpts").classList.toggle("hidden", !e.target.checked);
$("#provedor").onchange = e => {
  $("#iaHint").innerHTML = e.target.value==="groq"
    ? 'Gere grátis em <a href="https://console.groq.com/keys" target="_blank" rel="noopener">console.groq.com/keys</a>.'
    : 'Chave paga em <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>.';
};

// prefill (token é lembrado neste navegador, via localStorage)
try{
  const tokenSalvo = localStorage.getItem("auditor_rdo_token");
  const chaveSalva = localStorage.getItem("auditor_rdo_groq_key");
  if(tokenSalvo) $("#token").value = tokenSalvo;
  if(chaveSalva) $("#chaveIA").value = chaveSalva;
}catch(e){}

function salvarConfig(){
  try{
    localStorage.setItem("auditor_rdo_token", $("#token").value.trim());
    localStorage.setItem("auditor_rdo_groq_key", $("#chaveIA").value.trim());
  }catch(e){}
}
$("#token").addEventListener("change", salvarConfig);
$("#chaveIA").addEventListener("change", salvarConfig);
$("#esquecer").onclick = (e) => { e.preventDefault();
  try{ localStorage.removeItem("auditor_rdo_token"); }catch(err){}
  $("#token").value=""; toast("Token salvo foi apagado deste navegador.");
};

// carregar relatório
$("#btnCarregar").onclick = async () => {
  const token=$("#token").value.trim(), alvo=$("#alvo").value.trim();
  if(!token) return toast("Cole o token da empresa.");
  if(!alvo)  return toast("Cole a URL do relatório.");
  loading($("#btnCarregar"),true);
  try{
    salvarConfig();  // token é sempre lembrado neste PC
    const r = await fetch("/api/carregar",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({token, alvo})});
    const d = await r.json();
    if(!r.ok){ toast(d.erro||"Falha ao carregar."); return; }
    ESTADO.fotos=d.fotos; ESTADO.destino=d.destino; ESTADO.numero=d.numero;
    renderReport(d); renderGaleria(d.fotos);
    $("#cardReport").classList.remove("hidden");
    $("#cardResult").classList.add("hidden");
    $("#cardReport").scrollIntoView({behavior:"smooth",block:"start"});
  }catch(e){ toast("Erro: "+e); }
  finally{ loading($("#btnCarregar"),false); }
};

function renderReport(d){
  $("#chips").innerHTML =
    `<div class="chip"><span class="k">${d.modo==="obra"?"Obra":"Relatório"}</span> <b>${esc(String(d.titulo||""))}</b></div>
     ${d.subtitulo?`<div class="chip"><span class="k">${d.modo==="obra"?"":"Data"}</span> <b>${esc(d.subtitulo)}</b></div>`:""}
     <div class="chip"><span class="k">Fotos</span> <b>${d.total}</b></div>
     <div class="chip"><span class="k">Tarefas</span> <b>${d.tarefas}</b></div>
     <div class="chip"><span class="k">Grupos</span> <b>${d.grupos}</b></div>`;
  $("#destino").innerHTML = `Serão salvas em: <code>${esc(d.destino)}</code>`;
}

function renderGaleria(fotos){
  // Agrupa por LETRA do grupo (subpasta) e, dentro, por código da tarefa.
  const porGrupo={};
  fotos.forEach(f=>{ const k=f.subpasta||"SEM_GRUPO";
    (porGrupo[k]=porGrupo[k]||{grupo:f.grupo,desc:f.grupo_desc,cods:{}});
    (porGrupo[k].cods[f.codigo]=porGrupo[k].cods[f.codigo]||[]).push(f); });
  let html="";
  Object.keys(porGrupo).sort().forEach(k=>{
    const G=porGrupo[k];
    html+=`<div class="grupo-sec"><div class="grupo-head">
      <span class="grupo-letra">${esc(G.grupo||"?")}</span>
      <span class="grupo-nome">${esc(G.desc||"Sem grupo")}</span>
      <span class="grupo-pasta">📁 ${esc(k)}</span></div>`;
    Object.keys(G.cods).forEach(cod=>{
      const g=G.cods[cod];
      html+=`<div class="group-title"><span class="code">${esc(cod)}</span>
        <span class="desc">${esc((g[0].descricao||"").split("\\n")[0])}</span></div><div class="grid">`;
      g.forEach(f=>{
        html+=`<div class="ph" id="ph-${esc(f.uid)}">
          <div class="thumb"><span class="fname">${esc(f.nome_arquivo)}</span>
            <img loading="lazy" src="${img(f.miniatura)}" alt="${esc(f.nome_arquivo)}"></div>
          <div class="body"><div class="verd-slot"></div>
            <span class="badge-dl status">aguardando</span></div></div>`;
      });
      html+="</div>";
    });
    html+="</div>";
  });
  $("#galeria").innerHTML=html;
}

// processar (stream NDJSON)
$("#btnProcessar").onclick = async () => {
  const usarIA=$("#usarIA").checked;
  const payload={
    token:$("#token").value.trim(), alvo:$("#alvo").value.trim(),
    forcar:$("#forcar").checked, ia:usarIA,
    provedor:$("#provedor").value, chave_ia:$("#chaveIA").value.trim()
  };
  if(usarIA && !payload.chave_ia) return toast("Informe a chave da IA (ou desmarque a auditoria).");
  loading($("#btnProcessar"),true);
  $("#cardProgress").classList.remove("hidden");
  $("#cardResult").classList.add("hidden");
  $("#log").textContent=""; $("#pbarFill").style.width="0%"; $("#progTxt").textContent="Iniciando...";
  renderGaleria(ESTADO.fotos);
  $("#cardProgress").scrollIntoView({behavior:"smooth",block:"start"});

  try{
    const r=await fetch("/api/processar",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)});
    const reader=r.body.getReader(); const dec=new TextDecoder(); let buf="";
    while(true){
      const {value,done}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true}); const linhas=buf.split("\n"); buf=linhas.pop();
      for(const ln of linhas){ if(ln.trim()) handleEvent(JSON.parse(ln)); }
    }
  }catch(e){ toast("Erro no processamento: "+e); }
  finally{ loading($("#btnProcessar"),false); }
};

function logln(s){ const l=$("#log"); l.textContent+=s+"\n"; l.scrollTop=l.scrollHeight; }

function handleEvent(ev){
  if(ev.tipo==="log"){ logln("• "+ev.msg); }
  else if(ev.tipo==="inicio"){ ESTADO.destino=ev.destino;
    $("#progTxt").textContent=`0 / ${ev.total} fotos`; logln(`Baixando para: ${ev.destino}`); }
  else if(ev.tipo==="foto"){
    const pct=Math.round(ev.i/ev.total*100);
    $("#pbarFill").style.width=pct+"%"; $("#progTxt").textContent=`${ev.i} / ${ev.total} fotos`;
    const card=$("#ph-"+CSS.escape(ev.uid||ev.nome));
    if(card){
      const st=card.querySelector(".status");
      st.textContent = ev.status==="existe"?"já existia":(ev.status==="erro"?"erro":"baixada");
      if(ev.veredito){
        card.querySelector(".verd-slot").innerHTML=
          `<span class="verd v-${ev.veredito}">${ev.veredito}</span>
           <div class="motivo">${esc(ev.motivo||"")}</div>`;
      }
    }
    let linha=`[${ev.i}/${ev.total}] ${ev.subpasta?ev.subpasta+"/":""}${ev.nome} — ${ev.status}`;
    if(ev.veredito) linha+=` · ${ev.veredito}: ${ev.motivo||""}`;
    if(ev.status==="erro") linha+=` (${ev.detalhe||""})`;
    logln(linha);
  }
  else if(ev.tipo==="fim"){ ESTADO.csv=ev.csv; ESTADO.destino=ev.destino;
    logln("Concluído."); renderResumo(ev.resumo); $("#cardResult").classList.remove("hidden");
    $("#cardResult").scrollIntoView({behavior:"smooth",block:"start"}); }
  else if(ev.tipo==="erro"){ toast(ev.msg); logln("ERRO: "+ev.msg); }
}

function renderResumo(r){
  let html=`<div class="stat"><div class="n">${r.baixadas}/${r.total}</div><div class="l">Fotos baixadas</div></div>`;
  if(r.compativel||r.divergente||r.inconclusivo){
    html+=`<div class="stat ok"><div class="n">${r.compativel}</div><div class="l">Compatíveis</div></div>
      <div class="stat bad"><div class="n">${r.divergente}</div><div class="l">Divergentes</div></div>
      <div class="stat warn"><div class="n">${r.inconclusivo}</div><div class="l">Inconclusivas</div></div>`;
  }
  $("#summary").innerHTML=html;
}

$("#btnPasta").onclick=()=>fetch("/api/abrir-pasta",{method:"POST",headers:{"Content-Type":"application/json"},
  body:JSON.stringify({caminho:ESTADO.destino})}).then(r=>r.json()).then(d=>{ if(d.erro) toast(d.erro); });
$("#btnCsv").onclick=()=>{ if(ESTADO.csv) location.href="/api/csv?caminho="+encodeURIComponent(ESTADO.csv); };
$("#btnTrocar").onclick=()=>{ $("#cardReport").classList.add("hidden");
  $("#cardProgress").classList.add("hidden"); $("#cardResult").classList.add("hidden");
  $("#galeria").innerHTML=""; $("#cardConfig").scrollIntoView({behavior:"smooth"}); };
</script>
</body>
</html>
